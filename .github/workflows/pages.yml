name: Publish demo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "CONTRIBUTING.md"
      - "docs/**"

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run site:build -- tests/fixtures/vault --out=dist-demo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-demo
      - name: Wait for Pages artifact metadata
        uses: actions/github-script@v7
        with:
          script: |
            for (let attempt = 0; attempt < 12; attempt += 1) {
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
              });
              if (data.artifacts.some((artifact) => artifact.name === "github-pages" && !artifact.expired)) {
                core.info("The Pages artifact is visible to the deployment API.");
                return;
              }
              core.info(`Waiting for the Pages artifact metadata (attempt ${attempt + 1}/12).`);
              await new Promise((resolve) => setTimeout(resolve, 5000));
            }
            throw new Error("The uploaded Pages artifact did not become visible to the deployment API within 60 seconds.");
      - id: deployment
        uses: actions/deploy-pages@v4
